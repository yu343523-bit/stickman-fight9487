<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>火柴鬥魂 3on3</title>
<style>
html,body{margin:0;height:100%;background:#07070d;color:#9aa;font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;overflow:hidden}
#wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%}
#stage{position:relative;width:min(100vw,calc((100vh - 30px)*320/224));aspect-ratio:320/224}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated;background:#000;outline:none}
#cover{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,10,.72);color:#fff;font-size:clamp(14px,3vw,26px);font-weight:bold;cursor:pointer;letter-spacing:.1em}
#hint{height:30px;line-height:30px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100vw;padding:0 8px;box-sizing:border-box}
#hint b{color:#dde}
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="cv" tabindex="0"></canvas>
    <div id="cover">▶ 點擊畫面開始</div>
  </div>
  <div id="hint"></div>
</div>
<script>
'use strict';
/* ======================================================================
   火柴鬥魂 3on3  —  2D 火柴人 3 對 3 換人制格鬥
   可調整的規則常數都集中在這裡
   ====================================================================== */
const W=320,H=224,SC=3,GROUND=198,STW=520;
const ROUND_TIME=60*60;      // 每回合 60 秒
const KO_HEAL=0.25;          // 擊倒對手後回復 1/4 體力
const COMBO_MAX=14;          // 連擊數上限：達到後對手進入無敵
const JUG_MAX=5;             // 空中追打次數上限
const DMG_SCALE=1.3;         // 整體傷害倍率（調高＝節奏更快）
const GRAV=0.38;
const FONT='"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif';
const FONT2='Impact,"Arial Black","Microsoft JhengHei",sans-serif';

const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
cv.width=W*SC; cv.height=H*SC;

/* ---------------- util ---------------- */
const clamp=(v,a,b)=>v<a?a:v>b?b:v, ri=n=>Math.floor(Math.random()*n), sgn=v=>v<0?-1:1;
function shade(hex,k){const n=parseInt(hex.slice(1),16);let r=n>>16,g=(n>>8)&255,b=n&255;
  if(k<=1){r*=k;g*=k;b*=k}else{const q=k-1;r+=(255-r)*q;g+=(255-g)*q;b+=(255-b)*q}
  return 'rgb('+(r|0)+','+(g|0)+','+(b|0)+')';}
function ov(x,y,w,h,b){return x<b[0]+b[2]&&x+w>b[0]&&y<b[1]+b[3]&&y+h>b[1];}

/* ---------------- pixel primitives (logical 320x224) ---------------- */
let OX=0,OY=0;
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x+OX),Math.round(y+OY),w,h);}
function line(x0,y0,x1,y1,t,c){
  ctx.fillStyle=c;x0=Math.round(x0+OX);y0=Math.round(y0+OY);x1=Math.round(x1+OX);y1=Math.round(y1+OY);
  const h=t>>1;let dx=Math.abs(x1-x0),dy=Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1,e=dx-dy,n=0;
  for(;;){ctx.fillRect(x0-h,y0-h,t,t);if((x0===x1&&y0===y1)||++n>600)break;const e2=2*e;if(e2>-dy){e-=dy;x0+=sx;}if(e2<dx){e+=dx;y0+=sy;}}
}
function circ(cx,cy,r,c){ctx.fillStyle=c;cx=Math.round(cx+OX);cy=Math.round(cy+OY);
  for(let y=-r;y<=r;y++){const w=Math.floor(Math.sqrt(r*r-y*y+r*0.8));ctx.fillRect(cx-w,cy+y,w*2+1,1);}}
function text(s,x,y,c,size,align,font){ctx.font='bold '+(size||8)+'px '+(font||FONT);ctx.textAlign=align||'left';ctx.textBaseline='top';ctx.fillStyle=c;ctx.fillText(s,x,y);}
function textO(s,x,y,c,size,align,font,oc){oc=oc||'#000';
  text(s,x-1,y,oc,size,align,font);text(s,x+1,y,oc,size,align,font);text(s,x,y-1,oc,size,align,font);text(s,x,y+1,oc,size,align,font);text(s,x,y,c,size,align,font);}

/* ---------------- sound (WebAudio, 合成音效) ---------------- */
let AC=null,NB=null,MUTE=false;
function initAudio(){if(AC)return;try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;AC=new A();
  NB=AC.createBuffer(1,Math.floor(AC.sampleRate*0.6),AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  MUS.gain=AC.createGain();MUS.gain.gain.value=0.75;MUS.gain.connect(AC.destination);}catch(e){AC=null;}}
function tone(type,f0,f1,dur,vol){const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;o.type=type;o.frequency.setValueAtTime(f0,t);
  o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur);}
function noise(dur,vol,freq){const s=AC.createBufferSource(),g=AC.createGain(),f=AC.createBiquadFilter(),t=AC.currentTime;s.buffer=NB;f.type='lowpass';
  f.frequency.value=freq;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);s.connect(f);f.connect(g);g.connect(AC.destination);s.start(t);s.stop(t+dur);}
function sfx(n){if(!AC||MUTE)return;try{switch(n){
  case 'hit':noise(.09,.35,1800);tone('square',180,60,.08,.15);break;
  case 'heavy':noise(.16,.5,1200);tone('square',140,40,.15,.2);break;
  case 'blk':noise(.05,.2,5000);tone('triangle',900,600,.05,.1);break;
  case 'sw':noise(.07,.07,3000);break;
  case 'jump':tone('triangle',200,420,.1,.07);break;
  case 'sp':tone('sawtooth',300,900,.18,.09);break;
  case 'super':tone('sawtooth',120,1400,.5,.15);noise(.5,.15,4000);break;
  case 'ko':tone('square',500,50,.7,.2);noise(.5,.4,900);break;
  case 'ui':tone('square',660,660,.05,.06);break;
  case 'ok':tone('square',660,990,.1,.07);break;
  case 'chg':tone('triangle',400,800,.15,.12);break;
  case 'bell':tone('triangle',1200,1100,.4,.12);break;}}catch(e){}}

/* ======================================================================
   配樂：每張地圖一首，以 WebAudio 即時合成（8 小節循環）
   mel：每小節 8 個八分音符；數字/字母＝音階級數，- 延長，. 休止
   ====================================================================== */
const SCALES={min:[0,2,3,5,7,8,10],maj:[0,2,4,5,7,9,11],hmin:[0,2,3,5,7,8,11],phd:[0,1,4,5,7,8,10],pmin:[0,3,5,7,10],pmaj:[0,2,4,7,9],ins:[0,1,5,7,8],oct:[0,1,3,4,6,7,9,10]};
const DRUMS={rock:['x...x...','..x...x.','xxxxxxxx'],four:['x.x.x.x.','..x...x.','.x.x.x.x'],taiko:['x..x..x.','......x.','........'],soft:['x.......','....x...','x.x.x.x.'],none:['........','........','x...x...'],tribal:['x..x.x..','..x...xx','x.x.x.x.'],fast:['x..xx..x','..x...x.','xxxxxxxx']};
const TRACKS=[
 {sc:'min',root:57,bpm:120,prog:[0,5,6,4],lw:'square',bs:'walk',dr:'rock',arp:1,mel:['4-7-4-2-','5-4-2-0-','6-4-6-8-','7---4-..','4-7-9-7-','5-7-5-4-','6-8-6-4-','7-----..']},
 {sc:'pmin',root:62,bpm:100,prog:[0,0,3,2],lw:'triangle',bs:'slow',dr:'taiko',pl:1,mel:['0-2-3-2-','4-3-2-0-','3-5-3-2-','2---0-..','5-4-3-2-','3-2-0-2-','3-4-5-7-','5-----..']},
 {sc:'pmaj',root:60,bpm:108,prog:[0,3,4,3],lw:'sine',bs:'walk',dr:'soft',mel:['2-3-5-3-','4-3-2-1-','2-4-5-6-','5---3-..','7-6-5-3-','4-5-4-2-','1-2-3-1-','0-----..']},
 {sc:'hmin',root:62,bpm:132,prog:[0,5,3,4],lw:'sawtooth',bs:'drive',dr:'rock',arp:1,mel:['0-4-7-4-','5-7-5-4-','3-5-7-9-','6-4-6-8-','7-9-7-4-','5-4-5-7-','9-7-5-3-','6---4-..']},
 {sc:'oct',root:60,bpm:150,prog:[0,0,3,2],lw:'sawtooth',bs:'drive',dr:'fast',mel:['0.0.7.0.','6.4.3.1.','3.3.a.3.','7.6.4.3.','0.7.8.7.','a.8.7.6.','4.3.1.0.','1---0---']},
 {sc:'min',root:64,bpm:88,prog:[0,5,2,6],lw:'sine',bs:'slow',dr:'none',pl:1,arp:1,mel:['4---7---','5---4-2-','4---6---','5-----..','7---9---','8---7-5-','6---4-5-','4-----..']},
 {sc:'maj',root:60,bpm:126,prog:[0,3,4,0],lw:'square',bs:'walk',dr:'four',arp:1,mel:['4.4.5.7.','5-3-5-..','6.6.7.9.','7-4-2-..','4.4.5.7.','8-7-5-3-','4-6-8-6-','7-----..']},
 {sc:'phd',root:64,bpm:112,prog:[0,1,0,6],lw:'square',bs:'walk',dr:'tribal',mel:['0-1-2-1-','3-2-1-0-','4-5-4-2-','1---0-..','7-8-7-5-','4-5-4-2-','3-2-1-2-','0-----..']},
 {sc:'min',root:53,bpm:128,prog:[0,5,2,6],lw:'sawtooth',bs:'pulse',dr:'four',arp:1,mel:['7---4-2-','5---7---','6-4-6-8-','7---6-4-','7---9-b-','9---7---','8-6-4-6-','7-----..']},
 {sc:'min',root:52,bpm:144,prog:[0,0,5,6],lw:'square',bs:'drive',dr:'fast',mel:['0.0.2.0.','3.2.0...','5.5.7.5.','6.4.2.4.','7.7.9.7.','a.9.7.4.','5.4.2.4.','0---0-..']},
 {sc:'ins',root:64,bpm:92,prog:[0,0,2,3],lw:'triangle',bs:'slow',dr:'none',pl:1,mel:['0-2-3-4-','3-2-0---','5-4-3-2-','3---2-..','5-7-8-7-','5-4-3-2-','1-2-3-1-','0-----..']},
 {sc:'maj',root:62,bpm:138,prog:[0,4,5,3],lw:'square',bs:'pulse',dr:'rock',arp:1,mel:['0-2-4-7-','6-4-6-..','7-5-7-9-','8-7-5-3-','4-7-9-b-','a-8-6-4-','5-7-9-7-','7-----..']}
];
const MUS={id:0,step:0,next:0,gain:null};
const mfreq=m=>440*Math.pow(2,(m-69)/12);
function semi(sc,i){const n=sc.length;return sc[((i%n)+n)%n]+12*Math.floor(i/n);}
function mNote(t,f,dur,wave,vol,pluck){const o=AC.createOscillator(),g=AC.createGain();o.type=wave;o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vol,t+0.008);
  if(pluck)g.gain.exponentialRampToValueAtTime(0.0008,t+Math.max(0.25,dur*1.6));else{g.gain.setValueAtTime(vol,t+dur*0.75);g.gain.linearRampToValueAtTime(0.0001,t+dur);}
  o.connect(g);g.connect(MUS.gain);o.start(t);o.stop(t+(pluck?Math.max(0.25,dur*1.6):dur)+0.02);}
function mNoise(t,dur,vol,type,fq){const s=AC.createBufferSource(),g=AC.createGain(),f=AC.createBiquadFilter();s.buffer=NB;f.type=type;f.frequency.value=fq;
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);s.connect(f);f.connect(g);g.connect(MUS.gain);s.start(t);s.stop(t+dur+0.01);}
function mKick(t,deep){const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.setValueAtTime(deep?110:150,t);o.frequency.exponentialRampToValueAtTime(38,t+(deep?0.22:0.12));
  g.gain.setValueAtTime(deep?0.5:0.38,t);g.gain.exponentialRampToValueAtTime(0.001,t+(deep?0.3:0.15));o.connect(g);g.connect(MUS.gain);o.start(t);o.stop(t+0.32);}
function schedStep(tr,s,t,d){
  const sc=SCALES[tr.sc],bar=s>>3,i=s&7,row=tr.mel[bar],ch=row[i];
  if(ch!=='.'&&ch!=='-'){let len=1;while(i+len<8&&row[i+len]==='-')len++;mNote(t,mfreq(tr.root+semi(sc,parseInt(ch,36))),d*len*0.95,tr.lw,tr.lw==='sine'?0.16:tr.lw==='triangle'?0.15:0.065,tr.pl);}
  const deg=tr.prog[bar%4],br=tr.root-12+semi(sc,deg)-(semi(sc,deg)>6?12:0),bw=tr.bs==='slow'?'triangle':'sawtooth',bv=tr.bs==='slow'?0.2:0.085;
  if(tr.bs==='walk'){if(i%2===0)mNote(t,mfreq(br+(i===6?7:0)),d*1.6,'triangle',0.2);}
  else if(tr.bs==='pulse')mNote(t,mfreq(br+(i%2?12:0)),d*0.8,bw,bv);
  else if(tr.bs==='drive')mNote(t,mfreq(br),d*0.7,bw,bv);
  else if(i===0||i===4)mNote(t,mfreq(br+(i?7:0)),d*3.6,bw,bv);
  if(tr.arp){const seven=sc.length===7;for(let k=0;k<2;k++){const q=(i*2+k)%4,m=seven?tr.root+semi(sc,deg+[0,2,4,2][q]):tr.root+semi(sc,deg)+[0,7,12,7][q];mNote(t+k*d/2,mfreq(m+(tr.pl?12:0)),d*0.45,tr.pl?'sine':'square',tr.pl?0.05:0.022,tr.pl);}}
  const dr=DRUMS[tr.dr];if(dr[0][i]==='x')mKick(t,tr.dr==='taiko');if(dr[1][i]==='x'){if(tr.dr==='taiko'||tr.dr==='tribal')mKick(t+0.001,false);else mNoise(t,0.09,0.13,'bandpass',1800);}
  if(dr[2][i]==='x')mNoise(t,0.03,0.035,'highpass',7000);
}
function musicPlay(id){if(MUS.id===id)return;MUS.id=id;MUS.step=0;MUS.next=0;}
function musicTick(){
  if(!AC||!MUS.gain||MUS.id<0||MUTE||AC.state!=='running')return;
  const tr=TRACKS[MUS.id],d=30/tr.bpm,now=AC.currentTime;
  if(MUS.next<now-0.2)MUS.next=now+0.06;
  let n=0;while(MUS.next<now+0.18&&n++<8){try{schedStep(tr,MUS.step,MUS.next,d);}catch(e){}MUS.step=(MUS.step+1)%64;MUS.next+=d;}
}

/* ======================================================================
   骨架與姿勢  pose = [軀幹前傾, 前臂肩, 前臂肘, 後臂肩, 後臂肘, 前腿髖, 前腿膝, 後腿髖, 後腿膝, 全身旋轉, 頭]
   ====================================================================== */
const SK={hr:5,neck:2,torso:25,ua:12,fa:12,th:19,sn:19};   // 約 7.5 頭身
const P={
  idle:[8,35,95,-10,110,28,38,-18,14,0,0],
  walkA:[10,45,80,-25,95,38,22,-30,26,0,0],
  walkB:[10,-10,95,35,90,-22,30,30,14,0,0],
  crouch:[18,45,100,10,110,80,130,40,140,0,0],
  pre:[14,30,90,-5,100,45,60,10,50,0,0],
  jump:[4,40,70,-40,50,62,100,18,88,0,0],
  lp:[12,92,0,-20,120,30,36,-20,14,0,0],
  hp:[24,-35,115,96,0,40,42,-32,10,0,4],
  hpw:[2,30,100,-50,120,25,36,-18,14,0,0],
  lk:[-8,30,100,-15,105,72,4,-8,8,0,0],
  lkw:[0,30,100,-15,105,60,80,-8,8,0,0],
  hk:[-26,25,95,-30,80,-4,6,116,0,0,8],
  hkw:[-5,30,95,-20,95,5,8,60,95,0,0],
  clp:[18,86,0,10,110,80,130,40,140,0,0],
  chp:[2,-30,100,168,0,42,62,-10,30,0,-8],
  chpw:[26,20,90,20,100,80,130,40,140,0,0],
  clk:[6,40,100,0,110,86,4,65,150,0,0],
  chk:[-16,10,60,-60,30,85,150,80,0,0,6],
  jp:[14,62,0,-40,60,55,95,15,85,0,0],
  jhp:[20,-30,90,70,0,55,95,15,85,0,0],
  jk:[-4,30,90,-30,60,66,2,25,110,0,0],
  jhk:[-12,30,90,-30,60,30,110,62,0,0,4],
  hitH:[-20,-20,45,-55,30,35,30,-25,22,0,-16],
  hitL:[34,25,95,10,95,30,45,-20,25,0,18],
  air:[-12,130,20,155,10,45,35,12,45,-45,-10],
  down:[0,20,12,-25,10,12,6,-6,16,-90,0],
  blk:[-4,62,112,44,122,26,36,-18,14,0,4],
  cblk:[10,62,112,44,122,80,130,40,140,0,4],
  win:[-2,20,100,176,0,10,10,-10,8,0,-6],
  fbw:[-6,-30,70,-45,75,30,40,-22,14,0,0],
  fb:[24,90,0,84,6,42,44,-34,8,0,2],
  wv:[42,60,8,-20,100,62,82,-30,40,0,14],
  upw:[22,10,90,20,95,70,110,35,120,0,0],
  up:[-6,172,4,-30,70,58,100,-4,6,0,-10],
  dash:[38,-40,110,95,0,55,60,-45,20,0,-10],
  spin:[-18,60,60,-80,40,2,8,95,0,0,4],
  slide:[-40,10,40,-50,30,84,0,60,120,0,20],
  charge:[-4,20,120,25,125,34,44,-28,20,0,-6]
};
function lerpP(a,b,k){k=clamp(k,0,1);const o=new Array(11);for(let i=0;i<11;i++)o[i]=a[i]+(b[i]-a[i])*k;return o;}
function fk(p,s){
  const d=Math.PI/180,tl=p[0]*d,hip=[0,0];
  const sh=[Math.sin(tl)*SK.torso*s,-Math.cos(tl)*SK.torso*s];
  const ha=(p[0]+p[10])*d,hd=[sh[0]+Math.sin(ha)*(SK.neck+SK.hr)*s,sh[1]-Math.cos(ha)*(SK.neck+SK.hr)*s];
  const limb=(o,a1,a2,l1,l2)=>{const A=a1*d,B=a2*d,m=[o[0]+Math.sin(A)*l1*s,o[1]+Math.cos(A)*l1*s];return [m,[m[0]+Math.sin(B)*l2*s,m[1]+Math.cos(B)*l2*s]];};
  const a1=limb(sh,p[1],p[1]+p[2],SK.ua,SK.fa),a2=limb(sh,p[3],p[3]+p[4],SK.ua,SK.fa);
  const l1=limb(hip,p[5],p[5]-p[6],SK.th,SK.sn),l2=limb(hip,p[7],p[7]-p[8],SK.th,SK.sn);
  const all=[hip,sh,hd,a1[0],a1[1],a2[0],a2[1],l1[0],l1[1],l2[0],l2[1]];
  if(p[9]){const r=p[9]*d,c=Math.cos(r),sn=Math.sin(r);for(const q of all){const x=q[0],y=q[1];q[0]=x*c-y*sn;q[1]=x*sn+y*c;}}
  let my=hd[1]+SK.hr*s-2;for(const q of all)if(q[1]>my)my=q[1];
  for(const q of all)q[1]-=my+1;
  return {hip,sh,hd,fe:a1[0],fh:a1[1],be:a2[0],bh:a2[1],fk:l1[0],ff:l1[1],bk:l2[0],bf:l2[1]};
}

function drawAcc(ch,hx,hy,hr,dir,sx,sy,fl){
  const c3=fl?'#ffffff':ch.c3,sw=Math.sin(FR*0.13+hx*0.05)*2,bx=hx-dir*hr;
  switch(ch.acc){
    case 'band':rect(hx-hr,hy-3,hr*2+1,2,c3);line(bx,hy-2,bx-dir*7,hy+1+sw,1,c3);line(bx,hy-1,bx-dir*6,hy+4+sw,1,c3);break;
    case 'spike':rect(hx-hr,hy-hr-1,hr*2+1,3,c3);rect(hx-4,hy-hr-4,2,4,c3);rect(hx-1,hy-hr-5,2,5,c3);rect(hx+2,hy-hr-4,2,4,c3);break;
    case 'mohawk':rect(hx-1,hy-hr-4,3,5,c3);rect(hx-dir*3-1,hy-hr-3,3,4,c3);rect(hx+dir*2-1,hy-hr-2,2,2,c3);break;

   按鍵設定（可自訂，不可重複；選到已使用的按鍵時兩者互換）
   ====================================================================== */
const ACTS=[['u','上／跳躍'],['d','下／蹲下'],['l','左'],['r','右'],['lp','輕拳'],['lk','輕腳'],['hp','重拳'],['hk','重腳'],['g','防禦'],['t1','換人 1'],['t2','換人 2']];
const DEF_BIND=[{u:'KeyW',d:'KeyS',l:'KeyA',r:'KeyD',lp:'KeyJ',lk:'KeyK',hp:'KeyU',hk:'KeyI',g:'KeyH',t1:'KeyL',t2:'KeyO'},
  {u:'ArrowUp',d:'ArrowDown',l:'ArrowLeft',r:'ArrowRight',lp:'Numpad1',lk:'Numpad2',hp:'Numpad4',hk:'Numpad5',g:'Numpad0',t1:'Numpad3',t2:'Numpad6'}];
const LAPTOP_P2={u:'ArrowUp',d:'ArrowDown',l:'ArrowLeft',r:'ArrowRight',lp:'Semicolon',lk:'Quote',hp:'KeyP',hk:'BracketLeft',g:'Comma',t1:'Slash',t2:'Period'};
const RESERVED=['Escape','Enter','NumpadEnter','Space','Backspace','KeyM','Tab','MetaLeft','MetaRight','ContextMenu'];
let BIND=[Object.assign({},DEF_BIND[0]),Object.assign({},DEF_BIND[1])],KEYMAP={};
function buildKeymap(){KEYMAP={};BIND.forEach((b,p)=>{for(const a in b)if(b[a])KEYMAP[b[a]]=[p,a];});updateHint();}
function validBind(B){if(!Array.isArray(B)||B.length!==2)return false;const seen=new Set();
  for(const b of B){if(!b)return false;for(const [a] of ACTS){const c=b[a];if(typeof c!=='string'||RESERVED.includes(c)||seen.has(c))return false;seen.add(c);}}return true;}
function saveBind(){try{localStorage.setItem('stick3on3_keys',JSON.stringify(BIND));}catch(e){}}
function loadBind(){try{const B=JSON.parse(localStorage.getItem('stick3on3_keys')||'null');if(validBind(B))BIND=B.map(b=>{const o={};for(const [a] of ACTS)o[a]=b[a];return o;});}catch(e){}}
function keyName(c){if(!c)return '—';if(c.startsWith('Key'))return c.slice(3);if(c.startsWith('Digit'))return c.slice(5);
  if(c.startsWith('Numpad')){const r=c.slice(6),m={Add:'+',Subtract:'-',Multiply:'*',Divide:'/',Decimal:'.'};return '數字鍵'+(m[r]||r);}
  const m={ArrowLeft:'←',ArrowRight:'→',ArrowUp:'↑',ArrowDown:'↓',Semicolon:';',Quote:"'",BracketLeft:'[',BracketRight:']',Slash:'/',Period:'.',Comma:',',Backslash:'\\',Minus:'-',Equal:'=',Backquote:'`',
    ShiftLeft:'左Shift',ShiftRight:'右Shift',ControlLeft:'左Ctrl',ControlRight:'右Ctrl',AltLeft:'左Alt',AltRight:'右Alt',CapsLock:'CapsLock'};
  return m[c]||c;}
const kn=(p,a)=>keyName(BIND[p][a]);
function setBind(p,a,code){
  const old=BIND[p][a];if(old===code)return '沒有變更';let msg='已設定為 '+keyName(code);
  for(let q=0;q<2;q++)for(const [b,nm] of ACTS){if(BIND[q][b]===code&&!(q===p&&b===a)){BIND[q][b]=old;msg='與 '+(q+1)+'P「'+nm+'」互換按鍵（'+keyName(code)+' ⇄ '+keyName(old)+'）';}}
  BIND[p][a]=code;buildKeymap();saveBind();for(const k of KB){k.h.l=k.h.r=k.h.u=k.h.d=k.h.g=0;}return msg;}
function updateHint(){const el=document.getElementById('hint');if(!el)return;
  const row=p=>'<b>'+(p+1)+'P</b> '+kn(p,'u')+' '+kn(p,'l')+' '+kn(p,'d')+' '+kn(p,'r')+' 移動・'+kn(p,'lp')+' 輕拳 '+kn(p,'lk')+' 輕腳 '+kn(p,'hp')+' 重拳 '+kn(p,'hk')+' 重腳・'+kn(p,'g')+' 防禦・'+kn(p,'t1')+' / '+kn(p,'t2')+' 換人';
  el.innerHTML=row(0)+'　'+row(1)+'　<b>Esc</b> 暫停　<b>M</b> 靜音';}
let KC={p:0,i:0,cap:false,msg:''};
function openKeys(){KC={p:0,i:0,cap:false,msg:''};SCR='keys';}
function captureKey(code){
  if(code==='Escape'){KC.cap=false;KC.msg='已取消';sfx('ui');return;}
  if(RESERVED.includes(code)||/^F\d+$/.test(code)){KC.msg='「'+(code==='Space'?'空白鍵':code)+'」是系統保留鍵，請換一個';sfx('blk');return;}
  KC.msg=setBind(KC.p,ACTS[KC.i][0],code);KC.cap=false;sfx('ok');
}
function tickKeys(){
  const n=ACTS.length+3;
  for(const e of uiq){
    if(e.a==='esc'){toTitle();return;}
    if(e.a==='u'){KC.i=(KC.i+n-1)%n;sfx('ui');}
    if(e.a==='d'){KC.i=(KC.i+1)%n;sfx('ui');}
    if((e.a==='l'||e.a==='r')&&KC.i<ACTS.length){KC.p=1-KC.p;sfx('ui');}
    if(e.a==='lp'){
      if(KC.i<ACTS.length){KC.cap=true;KC.capAt=FR;KC.msg='';sfx('ok');return;}
      if(KC.i===ACTS.length){BIND=[Object.assign({},DEF_BIND[0]),Object.assign({},DEF_BIND[1])];buildKeymap();saveBind();KC.msg='已還原為預設按鍵';sfx('ok');}
      else if(KC.i===ACTS.length+1){const used=Object.values(BIND[0]);
        if(Object.values(LAPTOP_P2).some(c=>used.includes(c))){KC.msg='1P 已使用其中的按鍵，無法套用；請先調整 1P 或還原預設';sfx('blk');}
        else{BIND[1]=Object.assign({},LAPTOP_P2);buildKeymap();saveBind();KC.msg='2P 已改為無數字鍵盤配置';sfx('ok');}}
      else{toTitle();return;}
    }
  }
}
function renderKeys(){
  rect(0,0,W,H,'#0c1030');for(let y=0;y<H;y+=4)rect(0,y,W,1,'#0e1434');
  textO('按鍵設定',160,4,'#ffe040',12,'center');
  for(let p=0;p<2;p++){const x=p?168:12,col=p?'#4080ff':'#ff5040';textO((p+1)+'P',x+70,20,col,9,'center',FONT2);
    ACTS.forEach((a,i)=>{const y=32+i*12,sel=KC.p===p&&KC.i===i;
      rect(x,y,140,11,sel?(KC.cap?'#604010':'#243070'):'#141a3c');if(sel){rect(x,y,140,1,col);rect(x,y+10,140,1,col);}
      text(a[1],x+5,y+2,sel?'#ffffff':'#a8b4d8',7,'left');
      const cap=sel&&KC.cap;text(cap?((FR&16)?'請按下新按鍵…':''):kn(p,a[0]),x+135,y+2,cap?'#ffd040':'#ffe890',7,'right');});}
  ['還原預設按鍵','2P 套用無數字鍵盤配置（; \' P [ , / .）','返回標題'].forEach((s,k)=>{const i=ACTS.length+k,sel=KC.i===i,y=167+k*11;
    textO((sel?'▶ ':'　')+s,160,y,sel?'#ffe040':'#c0c8e0',7,'center');});
  if(KC.msg)textO(KC.msg,160,201,'#60ff80',7,'center');
  text(KC.cap?'按下想使用的按鍵（Esc 取消）。若該鍵已被使用，兩個動作會互換按鍵。':kn(0,'u')+'／'+kn(0,'d')+' 選擇動作　'+kn(0,'l')+'／'+kn(0,'r')+' 切換 1P・2P　'+kn(0,'lp')+'／Enter 變更　Esc 返回',160,213,'#8898c0',6,'center');
}
// 難度：0 簡單（玩家輔助＋弱電腦）、1 普通、2 困難（判斷精準、積極進攻的電腦）
const DIFFS=[{n:'簡單',c:'#60ff80',d:'簡易指令・自動防禦・連打輕拳自動連段・受到傷害減少'},
  {n:'普通',c:'#ffe040',d:'標準手感與標準電腦'},
  {n:'困難',c:'#ff6050',d:'電腦判斷精準、積極進攻、懂得超必殺取消'}];
let DIFF=1;
try{const v=parseInt(localStorage.getItem('stick3on3_diff'),10);if(v>=0&&v<=2)DIFF=v;}catch(e){}
function saveDiff(){try{localStorage.setItem('stick3on3_diff',String(DIFF));}catch(e){}}
function aiCfg(lv){return DIFF===0?{lvl:0.12+lv*0.5,agg:0.25,t:0}:DIFF===2?{lvl:Math.min(1,0.66+lv*0.38),agg:0.92,t:0}:{lvl:lv,agg:0.5,t:0};}
function mkInput(){return {h:{l:0,r:0,u:0,d:0,g:0},buf:{},hist:[],cmd:null};}
const KB=[mkInput(),mkInput()];
let uiq=[],FR=0,GF=0;
function press(inp,b){const t=inp.buf[b];return t!==undefined&&GF-t<=(inp.bufN||10);}
function motion(inp,seq,face){
  const map=k=>k==='f'?(face>0?'r':'l'):k==='b'?(face>0?'l':'r'):k;
  let t=GF,i=inp.hist.length-1;const gap=inp.gap||16;
  for(let s=seq.length-1;s>=0;s--){const k=map(seq[s]);let found=false;
    for(;i>=0;i--){const e=inp.hist[i];if(t-e.t>gap)return false;if(e.k===k){t=e.t;i--;found=true;break;}}
    if(!found)return false;}
  return true;
}
function onKey(e,down){
  if(SCR==='keys'&&KC.cap){e.preventDefault();if(down&&!e.repeat&&FR>KC.capAt+2)captureKey(e.code);return;}
  if(e.code==='KeyM'&&down&&!e.repeat){MUTE=!MUTE;if(MUS.gain)MUS.gain.gain.value=MUTE?0:0.75;return;}
  const m=KEYMAP[e.code];
  if(down&&!e.repeat){
    if(e.code==='Escape')uiq.push({p:0,a:'esc'});
    if(e.code==='Enter'||e.code==='NumpadEnter'||e.code==='Space')uiq.push({p:0,a:'lp'});
    if(e.code==='Backspace')uiq.push({p:0,a:'back'});
  }
  if(!m)return;
  e.preventDefault();
  const inp=KB[m[0]],a=m[1];
  if(down){if(e.repeat)return;uiq.push({p:m[0],a});
    if(a in inp.h){inp.h[a]=1;if(a!=='g'){inp.hist.push({k:a,t:GF});if(inp.hist.length>10)inp.hist.shift();}}
    else inp.buf[a]=GF;}
  else if(a in inp.h)inp.h[a]=0;
}
window.addEventListener('keydown',e=>{if(['Space','Backspace'].includes(e.code))e.preventDefault();onKey(e,true);});
window.addEventListener('keyup',e=>onKey(e,false));
window.addEventListener('blur',()=>{for(const k of KB){k.h.l=k.h.r=k.h.u=k.h.d=k.h.g=0;}});

/* ======================================================================
   對戰狀態
   ====================================================================== */
let SCR='title',G=null,PROJ=[],FX=[],CAM=0,SHAKE=0,HITSTOP=0,FREEZE=null,PAUSE=false,MVID=1;
let UNLOCK=false,MEM={};
try{UNLOCK=localStorage.getItem('stick3on3_clear')==='1';}catch(e){}
function saveUnlock(){UNLOCK=true;try{localStorage.setItem('stick3on3_clear','1');}catch(e){}}

function fx(type,x,y,o){FX.push(Object.assign({type,x,y,t:0,life:12},o||{}));}
function mkFighter(ch,team){return {ch,team,x:0,y:GROUND,vx:0,vy:0,kb:0,face:1,hp:ch.hp,hpLag:ch.hp,st:'idle',f:0,mv:null,mvId:0,mvHits:0,
  mvConnect:false,mvConnectHit:false,mvBlocked:false,stun:0,comboTaken:0,juggle:0,jugMv:0,limit:false,dead:false,flash:0,heal:0,airDone:false,
  chainN:0,ph:Math.random()*6,cblk:false,hitLow:false,jg:GRAV,rec:0,jumpId:0};}
function mkTeam(side,chars,leader,inp,ai){const T_={side,cur:0,leader,gauge:0,swapUsed:false,inp,ai,combo:0,comboT:0,leaving:null,corpse:null,members:[]};
  T_.members=chars.map(c=>mkFighter(c,T_));return T_;}
function startMatch(c0,l0,c1,l1,ai0,ai1,bgi,label){
  const t0=mkTeam(0,c0,l0,ai0?mkInput():KB[0],ai0?aiCfg(ai0):null);
  const t1=mkTeam(1,c1,l1,ai1?mkInput():KB[1],ai1?aiCfg(ai1):null);
  for(const T_ of [t0,t1]){T_.assist=DIFF===0&&!T_.ai;T_.inp.bufN=T_.assist?14:10;T_.inp.gap=T_.assist?24:16;T_.inp.hist.length=0;T_.inp.buf={};}
  G={teams:[t0,t1],state:'intro',t:0,timer:ROUND_TIME,round:1,winner:-2,bg:getBG(bgi),bgi,label:label||'',slow:0,reason:''};
  const a=t0.members[0],b=t1.members[0];a.x=STW/2-70;b.x=STW/2+70;a.face=1;b.face=-1;
  PROJ=[];FX=[];PT=[];GH=[];FLASH=0;GLITCH=0;CAM=STW/2-W/2;SHAKE=0;HITSTOP=0;FREEZE=null;PAUSE=false;SCR='fight';musicPlay(bgi);
}
const cur=T_=>T_.members[T_.cur];
function bench(T_){return [0,1,2].filter(i=>i!==T_.cur);}
function changeOK(T_){return !T_.swapUsed&&G.state==='fight'&&bench(T_).some(i=>!T_.members[i].dead);}
function nextAlive(T_){for(let i=1;i<=2;i++){const k=(T_.cur+i)%3;if(!T_.members[k].dead)return k;}return -1;}
function addGauge(T_,v){T_.gauge=Math.min(300,T_.gauge+v);}
function projCount(f){let n=0;for(const p of PROJ)if(p.own===f)n++;return n;}

function toNeutral(f){f.st='idle';f.mv=null;f.f=0;f.comboTaken=0;f.juggle=0;f.jugMv=0;f.limit=false;f.airDone=false;f.chainN=0;}
function setLand(f,rec){f.st='land';f.rec=rec;f.f=0;f.mv=null;f.vx=0;}
function startMove(f,m){f.st='atk';f.mv=m;f.f=0;f.mvHits=0;f.mvConnect=false;f.mvConnectHit=false;f.mvBlocked=false;f.mvId=++MVID;
  if(f.y>=GROUND)f.vx=0;sfx(m.sp?'sp':'sw');}
function doJump(f,dir){f.st='jump';f.mv=null;f.f=0;f.vy=-f.ch.jump;f.vx=dir*f.face*f.ch.spd*1.3;f.airDone=false;f.jumpId=++MVID;sfx('jump');}
function enter(T_,f){const s=T_.side;f.st='in';f.f=0;f.x=CAM+(s?W+16:-16);f.y=GROUND-96;f.vx=(s?-1:1)*3.4;f.vy=0.5;f.face=s?-1:1;}

function trySwap(f){
  const T_=f.team,inp=T_.inp,k1=press(inp,'t1'),k2=press(inp,'t2');
  if(!k1&&!k2)return false;
  inp.buf.t1=inp.buf.t2=undefined;
  if(!changeOK(T_))return false;
  const b=bench(T_);let idx=k1?b[0]:b[1];if(T_.members[idx].dead)idx=k1?b[1]:b[0];
  if(T_.members[idx].dead)return false;
  T_.swapUsed=true;f.st='out';f.mv=null;f.f=0;f.vx=-f.face*4.2;f.vy=-6;f.comboTaken=0;f.limit=false;T_.leaving=f;
  T_.cur=idx;enter(T_,T_.members[idx]);fx('txt',f.x,f.y-96,{s:'CHANGE!',c:'#60ff80',life:40});sfx('chg');
  return true;
}
function trySpecial(f,opp,onlySup){
  const T_=f.team,inp=T_.inp,ch=f.ch,face=f.face;let want=null;
  if(inp.cmd){want=inp.cmd;inp.cmd=null;}
  else if(T_.assist&&inp.h.g){
    const b=['lp','lk','hp','hk'].find(x=>press(inp,x));
    if(b){want={lp:'s1',lk:'s2',hp:'s3'}[b]||((T_.members[T_.leader]===f&&T_.gauge>=200)?'ls':'sup');inp.buf[b]=undefined;}
  }
  else{
    const pp=press(inp,'lp')||press(inp,'hp'),kk=press(inp,'lk')||press(inp,'hk');
    if(pp){if(motion(inp,'db',face))want='sup';else if(motion(inp,'df',face))want='s1';else if(motion(inp,'dd',face))want='s3';}
    if(!want&&kk){if(motion(inp,'db',face))want='s2';else if(motion(inp,'df',face))want='ls';}
  }
  if(!want)return false;
  if(onlySup&&want!=='sup'&&want!=='ls')return false;
  const m=ch.mv[want];
  if(want==='sup'&&T_.gauge<100)return false;
  if(want==='ls'&&(T_.members[T_.leader]!==f||T_.gauge<200))return false;
  if(m.proj&&projCount(f)>0)return false;
  inp.buf.lp=inp.buf.hp=inp.buf.lk=inp.buf.hk=undefined;inp.hist.length=0;
  if(Math.abs(opp.x-f.x)>1&&f.y>=GROUND)f.face=opp.x>f.x?1:-1;
  startMove(f,m);
  if(m.sup){T_.gauge-=m.lead?200:100;FREEZE={t:m.lead?48:30,max:m.lead?48:30,f,name:m.name,lead:m.lead,col:m.col};sfx('super');}
  return true;
}
function tryNormal(f,fromLvl){
  const inp=f.team.inp,air=f.y<GROUND,cr=!air&&inp.h.d;
  for(const b of ['hp','hk','lp','lk']){
    if(!press(inp,b))continue;
    const m=NORM[(air?'j':cr?'c':'')+b];
    if(fromLvl>0){const cm=f.mv;if(!(m.lvl>fromLvl||(m.lvl===1&&fromLvl===1&&m!==cm&&f.chainN<2)))continue;}
    const cn=fromLvl>0?f.chainN+1:0;
    inp.buf[b]=undefined;startMove(f,m);f.chainN=cn;if(fromLvl>0&&!air)f.vx=f.face*1.3;return true;
  }
  return false;
}
function updNeutral(f,opp){
  const T_=f.team,inp=T_.inp;
  if(Math.abs(opp.x-f.x)>1)f.face=opp.x>f.x?1:-1;
  if(G.state!=='fight'){if(G.state==='end'&&G.winner===T_.side){f.st='win';f.f=0;}else f.st='idle';f.vx=0;return;}
  if(trySwap(f)||trySpecial(f,opp)||tryNormal(f,0))return;
  if(inp.h.g){f.st=inp.h.d?'crouch':'idle';f.vx=0;return;}
  const fw=f.face>0?inp.h.r:inp.h.l,bk=f.face>0?inp.h.l:inp.h.r;
  if(fw&&!inp.h.d&&(dbl(inp,f.face>0?'r':'l')||inp.wantRun)){inp.wantRun=0;f.st='run';f.f=0;fx('dust',f.x,GROUND);return;}
  if(bk&&!inp.h.d&&dbl(inp,f.face>0?'l':'r')){f.st='bstep';f.f=0;f.vx=-f.face*4.2;f.vy=-2.6;sfx('jump');return;}
  if(inp.h.u){doJump(f,fw?1:bk?-1:0);return;}
  if(inp.h.d){f.st='crouch';f.vx=0;}
  else if(fw){f.st='walk';f.vx=f.face*f.ch.spd;}
  else if(bk){f.st='walk';f.vx=-f.face*f.ch.spd*0.75;}
  else{f.st='idle';f.vx=0;}
}
function dbl(inp,k){const h=inp.hist,n=h.length;if(n<2)return false;const a=h[n-1],b=h[n-2];
  if(a.k!==k||b.k!==k||a.t===inp.dashT||GF-a.t>3||a.t-b.t>(inp.gap>16?18:13))return false;inp.dashT=a.t;return true;}
function updRun(f,opp){
  const T_=f.team,inp=T_.inp;
  if(G.state!=='fight'){toNeutral(f);f.vx=0;return;}
  const v=f.vx;
  if(trySwap(f)||trySpecial(f,opp))return;
  if(tryNormal(f,0)){f.vx=v*0.55;return;}
  const fw=f.face>0?inp.h.r:inp.h.l;
  if(inp.h.u){doJump(f,1);f.vx=f.face*f.ch.spd*2.1;return;}
  if(!fw||inp.h.g||inp.h.d){toNeutral(f);f.vx=0;return;}
  f.vx=f.face*f.ch.spd*2.3;if(f.f%9===0)fx('dust',f.x-f.face*6,GROUND);
}
function autoCombo(f,opp){
  const m=f.mv,inp=f.team.inp,T_=f.team;if(m.nocan)return false;
  const nx={lp:'lk',clp:'lk',lk:'hp',clk:'hp',jlp:'jhk',jlk:'jhk'}[m.key];
  if(nx){inp.buf.lp=undefined;startMove(f,NORM[nx]);f.chainN++;if(f.y>=GROUND)f.vx=f.face*1.3;return true;}
  if(m.air)return false;
  let want=null;
  if(T_.gauge>=200&&T_.members[T_.leader]===f)want='ls';else if(T_.gauge>=100)want='sup';
  else for(const ty of ['dash','spin','slide','uppercut','fireball','wave']){const k=['s1','s2','s3'].find(q=>f.ch.mv[q].ty===ty&&!(f.ch.mv[q].proj&&projCount(f)>0));if(k){want=k;break;}}
  if(!want)return false;inp.buf.lp=undefined;inp.cmd=want;return trySpecial(f,opp);
}
function updAtk(f,opp){
  const m=f.mv,t=f.f,inp=f.team.inp;let moving=false;
  if(m.vel)for(const v of m.vel){if(t===v.f&&v.vy!==undefined){f.vy=v.vy;}if(t>=v.f&&t<=(v.to===undefined?v.f:v.to)){f.vx=f.face*v.vx;moving=true;}}
  if(m.proj&&t===m.proj.f)spawnProj(f,m.proj,m);
  if(m.fn)m.fn(f,t,opp);
  if(m.abortAt&&t===m.abortAt&&!f.mvConnectHit){f.f=m.abortTo;}
  if(f.team.assist&&f.mvConnectHit&&!m.sp&&!m.sup&&G.state==='fight'&&!inp.h.g&&press(inp,'lp')&&autoCombo(f,opp))return;
  if(m.sp&&!m.sup&&f.mvConnectHit&&f.y>=GROUND&&G.state==='fight'&&trySpecial(f,opp,true))return;

function applyHit(a,d,h,m,pr){

    if(m.sp||m.sup)d.hp=Math.max(1,d.hp-Math.round(h.dmg*0.1*DMG_SCALE));
    if(!pr){a.mvConnect=true;a.mvBlocked=true;if(atWall&&a.y>=GROUND&&!m.vel)a.kb=-dir*2.4;}
    addGauge(a.team,3);addGauge(T_,2);fx('blk',px,py);sfx('blk');HITSTOP=4;return 1;
  }

  }else{d.st='hit';d.stun=Math.max(8,(h.hs||14)-(d.comboTaken>>2));d.vx=dir*(h.push===undefined?2:h.push);d.hitLow=ty==='low'||py>d.y-40;}
  d.f=0;d.mv=null;

  if(d.comboTaken>=COMBO_MAX||d.juggle>=JUG_MAX){d.limit=true;fx('txt',d.x,d.y-100,{s:'COMBO LIMIT',c:'#80c0ff',life:50});}
  addGauge(a.team,dmg*0.14);addGauge(T_,dmg*0.08);

  if(d.hp<=0){d.hp=0;d.dead=true;d.limit=false;d.st='air';d.vx=dir*2.6;d.vy=-6.2;d.jg=GRAV;if(d.y>=GROUND)d.y=GROUND-1;
    G.state='ko';G.t=0;G.slow=45;HITSTOP=14;SHAKE=12;sfx('ko');koFX(d.x,d.y-45,m.col||a.ch.fxc);}
  return 2;
}
function spawnProj(f,p,m){const s=f.ch.sc;PROJ.push({x:f.x+f.face*22*s,y:f.y+p.y*s,vx:f.face*p.vx,own:f,team:f.team,w:p.w,h:p.h,t:0,life:150,dead:false,

function solid(f){return f.st!=='in'&&f.st!=='out'&&f.st!=='ko'&&f.st!=='down';}

/* ---------------- 回合流程 ---------------- */
function resolveKO(){
  const lost=[];
  for(const T_ of G.teams){if(cur(T_).dead&&nextAlive(T_)<0)lost.push(T_.side);}
  if(lost.length){endMatch(lost.length===2?-1:1-lost[0],'ko');return;}
  for(const T_ of G.teams){const f=cur(T_);
    if(f.dead){T_.corpse={f,t:50};T_.cur=nextAlive(T_);enter(T_,cur(T_));}
    else{const add=Math.round(f.ch.hp*KO_HEAL);f.hp=Math.min(f.ch.hp,f.hp+add);f.heal=50;fx('txt',f.x,f.y-100,{s:'回復 +25%',c:'#60ff80',life:60});}
  }
  PROJ=[];G.round++;G.timer=ROUND_TIME;G.state='intro';G.t=20;
}
function decideTime(){
  const c=G.teams.map(T_=>T_.members.filter(f=>!f.dead).length);let w;
  if(c[0]!==c[1])w=c[0]>c[1]?0:1;
  else{const h=G.teams.map(T_=>T_.members.reduce((s,f)=>s+f.hp,0));w=h[0]===h[1]?-1:(h[0]>h[1]?0:1);}
  endMatch(w,'time');
}
function endMatch(w,reason){G.state='end';G.t=0;G.winner=w;G.reason=reason;PROJ=[];}

function stepFight(){
  const A=G.teams[0],B=G.teams[1];
  G.t++;GF++;
  if(G.state==='intro'){if(G.t>=80){G.state='fight';G.t=0;sfx('bell');}}
  else if(G.state==='fight'){if(--G.timer<=0){G.timer=0;G.state='timeup';G.t=0;sfx('bell');}}
  let a=cur(A),b=cur(B);
  if(G.state==='fight'){if(A.ai)aiThink(A,a,b);if(B.ai)aiThink(B,b,a);}
  updFighter(a,b);a=cur(A);b=cur(B);updFighter(b,a);a=cur(A);b=cur(B);
  for(const T_ of G.teams){
    if(T_.leaving){const f=T_.leaving;f.f++;f.vy+=GRAV*0.5;f.x+=f.vx;f.y+=f.vy;if(f.x<CAM-40||f.x>CAM+W+40||f.f>90){T_.leaving=null;f.y=GROUND;f.vx=f.vy=0;f.st='idle';}}
    if(T_.corpse&&--T_.corpse.t<=0)T_.corpse=null;
    if(T_.comboT>0)T_.comboT--;
    for(const f of T_.members){if(f.hpLag>f.hp)f.hpLag=Math.max(f.hp,f.hpLag-4);else f.hpLag=f.hp;}
  }
  trailFX(a);trailFX(b);
  checkHits(a,b);checkHits(b,a);
  updProj();
  bounds(a,b);
  const fa=a.st==='in'?b.x:a.x,fb=b.st==='in'?a.x:b.x;
  CAM+=(clamp((fa+fb)/2-W/2,0,STW-W)-CAM)*0.18;
  updFX();
  if(G.state==='ko'){const ok=G.teams.every(T_=>{const f=cur(T_);return !f.dead||f.st==='ko';});if(G.t>=100&&ok)resolveKO();}
  else if(G.state==='timeup'){if(G.t>=90)decideTime();}
  else if(G.state==='end'){if(G.t>=170)afterMatch();}
}
function updFX(){for(const e of FX)e.t++;FX=FX.filter(e=>e.t<e.life);if(SHAKE>0)SHAKE--;updParts();}

   電腦 AI
   ====================================================================== */
function aiThink(T_,f,opp){
  const A=T_.ai,inp=T_.inp,lv=A.lvl,ch=f.ch;
  inp.h.l=inp.h.r=inp.h.u=inp.h.d=0;inp.cmd=null;inp.wantRun=0;const agg=A.agg===undefined?0.5:A.agg;
  const dx=opp.x-f.x,dist=Math.abs(dx),fw=dx>=0?'r':'l',bk=dx>=0?'l':'r';
  const hold=k=>{inp.h[k]=1;},tap=b=>{inp.buf[b]=GF;};
  const neutral=f.st==='idle'||f.st==='walk'||f.st==='crouch'||f.st==='run',isLead=T_.members[T_.leader]===f;
  if(A.demo&&f.st!=='atk'&&f.st!=='jump'){demoDrive(T_,f,opp);return;}
  const keyOf=types=>{const ks=['s1','s2','s3'].filter(k=>types.includes(ch.mv[k].ty)&&!(ch.mv[k].proj&&projCount(f)>0));return ks.length?ks[ri(ks.length)]:null;};
  if(f.st==='atk'){
    const m=f.mv;
    if(m.sp&&!m.sup&&f.mvConnectHit&&f.y>=GROUND&&A.scId!==f.mvId){A.scId=f.mvId;
      if(T_.gauge>=100&&Math.random()<lv*agg*1.1){inp.cmd=(isLead&&T_.gauge>=200)?'ls':'sup';return;}}
    if(f.mvBlocked&&!f.mvConnectHit&&m.lvl===1&&A.bsId!==f.mvId){A.bsId=f.mvId;if(Math.random()<agg*0.6)tap(Math.random()<0.5?'lk':'hp');}
    if(f.mvConnectHit&&A.cid!==f.mvId){A.cid=f.mvId;A.q=null;
      if(Math.random()<0.2+0.75*lv&&!m.sp&&!m.sup){
        if(m.air){if(m.lvl===1)A.q='hk';}
        else if(m.jc)A.q='jc';
        else if(m.lvl===1)A.q=Math.random()<0.3?'chp':'hp';
        else if(!m.nocan){if(isLead&&T_.gauge>=200&&Math.random()<0.6)A.q='ls';else if(T_.gauge>=100&&Math.random()<0.5)A.q='sup';else A.q=keyOf(['dash','spin','uppercut','slide','fireball']);}
      }}
    if(A.q&&f.mvConnectHit){const q=A.q;
      if(q==='jc'){hold('u');hold(fw);}
      else if(q==='hp'||q==='hk'){tap(q);A.q=null;}
      else if(q==='chp'){hold('d');tap('hp');A.q=null;}
      else{inp.cmd=q;A.q=null;}}
    return;
  }
  if(f.st==='jump'){
    if(A.q==='jc'){if(opp.st==='air'&&dist<48&&Math.abs(opp.y-f.y)<50&&!f.airDone){tap('lp');A.q=null;}else if(f.vy>2)A.q=null;hold(fw);return;}
    if(A.plan==='jumpin'&&!f.airDone&&f.vy>0&&dist<64)tap(Math.random()<0.5?'hk':'hp');
    return;
  }
  if(!neutral){A.plan=null;A.t=0;return;}
  A.q=null;
  if(f.st==='run'){if(dist<46){tap(['lp','hp','lk','hk'][ri(4)]);A.plan='wait';A.t=6;}else hold(fw);return;}
  if(f.hp<f.ch.hp*0.3&&changeOK(T_)&&Math.random()<0.02){tap('t1');return;}
  const oatk=opp.st==='atk'?opp.mv:null;
  let pth=null;for(const p of PROJ){if(p.team!==T_&&Math.abs(p.x-f.x)<60&&sgn(p.vx)===sgn(f.x-p.x))pth=p;}
  if((oatk&&opp.f<=oatk.la&&dist<(oatk.beam?260:oatk.vel?130:70))||pth){
    const key=pth?'p'+pth.id:opp.mvId;
    if(A.thId!==key){A.thId=key;A.blk=Math.random()<0.15+0.75*lv;const low=!pth&&oatk.hits[0]&&oatk.hits[0].ty==='low';A.blkLow=low?Math.random()<0.4+0.6*lv:false;}
    if(A.blk){hold(bk);if(A.blkLow)hold('d');return;}
  }
  if((opp.st==='jump'||(oatk&&oatk.air))&&opp.vy>-1&&dist<62&&opp.y<GROUND-20){
    if(A.aaId!==opp.jumpId){A.aaId=opp.jumpId;A.aa=Math.random()<lv*0.8;}
    if(A.aa){A.aa=false;const k=keyOf(['uppercut']);if(k)inp.cmd=k;else{hold('d');tap('hp');}return;}
  }
  if(oatk&&opp.f>oatk.la&&dist<110&&A.punId!==opp.mvId){A.punId=opp.mvId;
    if(Math.random()<lv){
      if(T_.gauge>=100&&Math.random()<0.4){inp.cmd=(isLead&&T_.gauge>=200)?'ls':'sup';return;}
      const k=keyOf(['dash','slide','spin']);if(k&&dist>40){inp.cmd=k;return;}
      A.plan='poke';A.t=20;}}
  if(--A.t<=0||!A.plan){
    const r=Math.random();let p;
    if(dist>130)p=r<0.45?'approach':r<0.55+0.3*lv?'zone':r<0.9?'jumpin':'wait';
    else if(dist>54)p=r<0.35?'approach':r<0.55?'rush':r<0.7?'jumpin':r<0.78?'zone':r<0.86?'retreat':'wait';
    else p=r<0.62?'poke':r<0.74?'low':r<0.82?'retreat':r<0.88?'jumpin':'wait';
    if(Math.random()>0.45+0.55*lv)p='wait';
    if((p==='wait'||p==='retreat')&&Math.random()<agg*0.55)p=dist>54?'approach':'poke';
    A.plan=p;A.t=Math.max(4,Math.round((10+ri(24))*(1.25-agg*0.7)));
  }
  switch(A.plan){
    case 'approach':hold(fw);if(dist>100&&agg>0.7&&Math.random()<0.08)inp.wantRun=1;break;
    case 'retreat':hold(bk);break;
    case 'zone':{const k=keyOf(['fireball','wave']);if(k)inp.cmd=k;else hold(fw);A.plan='wait';A.t=18+ri(20);break;}
    case 'rush':{const k=keyOf(['dash','slide','spin','teleport']);if(k)inp.cmd=k;else hold(fw);A.plan='wait';A.t=14;break;}
    case 'jumpin':hold('u');hold(fw);break;
    case 'poke':if(dist<50){tap(['lp','lk','hp','hk'][ri(4)]);A.plan='wait';A.t=6+ri(10);}else hold(fw);break;
    case 'low':if(dist<52){hold('d');tap(Math.random()<0.6?'lk':'hk');A.plan='wait';A.t=8+ri(10);}else hold(fw);break;
  }
}

function weather(th,cam){
  const w=th.wx;if(!w)return;const n=w.n||20,top=GROUND-12;
  for(let i=0;i<n;i++){const a=(i*127.1)%W,b=(i*311.7)%top,sp=0.4+(i%5)*0.15;let x,y;
    switch(w.k){
      case 'fall':x=mod(a+Math.sin((FR+i*40)*0.03)*8+FR*0.2*sp-cam*0.5,W);y=mod(b+FR*sp*0.8,top);rect(x,y,i%3?1:2,i%3?1:2,w.c);break;
      case 'rise':x=mod(a+Math.sin((FR+i*30)*0.05)*5-cam*0.5,W);y=top-mod(b+FR*sp,top);rect(x,y,1,i%2?1:2,(i+(FR>>3))%4?w.c:'#ffffff');break;
      case 'rain':x=mod(a*3-FR*1.5-cam*0.8,W);y=mod(b+FR*(5+sp*3),top+10);rect(x,y,1,5,w.c);break;
      case 'blow':x=mod(a+FR*(2+sp*2)-cam,W);y=top-34+mod(b,44)+Math.sin((FR+i*20)*0.1)*2;rect(x,y,i%2?2:1,1,w.c);break;
      case 'cloud':x=mod(a*2.3+FR*0.15*sp-cam*0.3,W+80)-40;y=18+(i*37)%96;rect(x,y,26+i%3*8,4,w.c);rect(x+5,y-3,14+i%2*6,3,w.c);rect(x+3,y+4,20,2,w.c);break;
      case 'wave':x=mod(a*2+FR*0.3*sp-cam*0.4,W);y=GROUND-48+(i*7)%34;if(((FR>>3)+i)%3)rect(x,y,3+i%3,1,w.c);break;
    }}
}

function getPose(f){
  if((f.st==='idle'||f.st==='crouch')&&G&&G.state==='fight'&&f.team.inp.h.g)return f.st==='crouch'?P.cblk:P.blk;
  switch(f.st){
    case 'idle':{const b=Math.sin(FR*0.1+f.ph),p=P.idle.slice();p[0]+=b;p[2]+=b*3;p[4]+=b*3;p[6]+=b*2;p[8]+=b;return p;}
    case 'run':{const p=lerpP(P.walkA,P.walkB,(Math.sin(FR*0.5+f.ph)+1)/2);p[0]+=20;p[1]-=25;p[3]-=15;p[5]+=8;return p;}
    case 'bstep':return lerpP(P.pre,P.jump,0.55);
    case 'walk':return lerpP(P.walkA,P.walkB,(Math.sin(FR*0.22*(f.ch.spd/1.5)+f.ph)+1)/2);
    case 'crouch':return P.crouch;
    case 'jump':case 'in':case 'out':return P.jump;
    case 'land':return P.pre;
    case 'atk':{const k=f.mv.kf,t=f.f;if(t<=k[0][0])return k[0][1];
      for(let i=1;i<k.length;i++)if(t<=k[i][0]){const a=k[i-1],b=k[i];return lerpP(a[1],b[1],(t-a[0])/((b[0]-a[0])||1));}
      return k[k.length-1][1];}
    case 'hit':return f.hitLow?P.hitL:P.hitH;
    case 'blk':return f.cblk?P.cblk:P.blk;
    case 'air':{const p=P.air.slice();p[9]=clamp(-60-f.vy*6,-115,-20);return p;}
    case 'down':case 'ko':return P.down;
    case 'getup':return lerpP(P.down,P.crouch,f.f/16);
    case 'win':return lerpP(P.idle,P.win,f.f/12);
  }
  return P.idle;
}

function mkSel(cpu){return {cur:cpu?4:0,picks:[],leader:-1,ld:0,done:false,cpu};}
function startSelect(mode){SEL={mode,p:[mkSel(false),mkSel(mode!=='vs')],t:0,go:0};SCR='select';}

function tickSelect(){
  SEL.t++;

    if(e.a==='esc'){toTitle();return;}
    const pi=SEL.p[1].cpu?0:e.p,s=SEL.p[pi];if(s.done)continue;
    if(s.picks.length<3){
      let c=s.cur;
      if(e.a==='l')c=(c%5===0)?c+4:c-1;if(e.a==='r')c=(c%5===4)?c-4:c+1;if(e.a==='u')c=(c+10)%15;if(e.a==='d')c=(c+5)%15;

      if(e.a==='lp'){if(unlocked(c)&&!s.picks.includes(c)){s.picks.push(c);s.ld=0;sfx('ok');}else sfx('blk');}
      if(e.a==='lk'&&s.picks.length){s.picks.pop();sfx('ui');}
    }else{
      if(e.a==='l'){s.ld=(s.ld+2)%3;sfx('ui');}
      if(e.a==='r'){s.ld=(s.ld+1)%3;sfx('ui');}
      if(e.a==='lp'){s.leader=s.ld;s.done=true;sfx('ok');}
      if(e.a==='lk'){s.picks.pop();sfx('ui');}

  else if(SEL.mode==='cpu'){LAST={c0:a.picks.map(i=>CH[i]),l0:a.leader,c1:randTeam(pool).map(i=>CH[i]),l1:ri(3),ai:0.5,bg:0,label:''};openStage('pick');}

function tickFight(){
  for(const e of uiq){if(e.a==='esc'){PAUSE=!PAUSE;sfx('ui');}else if(PAUSE&&e.a==='back'){ARC=null;toTitle();return;}}
  if(PAUSE)return;
  if(G.state==='end'&&G.t>40&&uiq.some(uiConfirm)){afterMatch();return;}
  simFrame();
}
function simFrame(){
  if(FREEZE){if(--FREEZE.t<=0)FREEZE=null;return;}
  if(HITSTOP>0){HITSTOP--;updFX();return;}
  if(G.slow>0){G.slow--;if(G.slow%3)return;}
  stepFight();
}
function tick(){
  FR++;
  switch(SCR){case 'title':tickTitle();break;case 'how':tickHow();break;case 'select':tickSelect();break;
    case 'fight':tickFight();break;case 'result':tickResult();break;case 'ending':tickEnding();break;case 'stage':tickStage();break;case 'keys':tickKeys();break;case 'demo':tickDemo();break;}
  uiq.length=0;
}
function render(){
  ctx.setTransform(SC,0,0,SC,0,0);ctx.imageSmoothingEnabled=false;ctx.globalAlpha=1;OX=0;OY=0;
  switch(SCR){case 'title':renderTitle();break;case 'how':renderHow();break;case 'select':renderSelect();break;
    case 'fight':renderFight();break;case 'result':renderResult();break;case 'ending':renderEnding();break;case 'stage':renderStage();break;case 'keys':renderKeys();break;case 'demo':renderDemo();break;}
  if(MUTE)text('靜音',W-4,H-9,'#8898c0',6,'right');
}
let lastTs=0,acc=0;
function loop(ts){if(!lastTs)lastTs=ts;acc+=Math.min(100,ts-lastTs);lastTs=ts;let n=0;
  while(acc>=1000/60&&n<5){tick();acc-=1000/60;n++;}
  render();requestAnimationFrame(loop);}

window.addEventListener('keydown',()=>{if(cover.style.display!=='none')focusGame();},{once:true});
